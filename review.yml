actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Helix's developer APIs are partner-gated
    with no openly published specification or base URL. No AsyncAPI document was created
    because there is no documented server-push transport to model, and no endpoints were
    fabricated - the API entries are modeled from public product documentation only.
