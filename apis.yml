name: Helix
kind: company
description: Helix is a population genomics company operating an end-to-end precision
  health platform - a proprietary Exome+ next-generation sequencing assay, a CLIA/CAP-certified
  clinical lab, and bioinformatics tooling - that enables health systems, life sciences
  companies, and payers to integrate genomic data into clinical care and research at
  population scale. Through its DNA Product Studio, Helix exposes a partner-gated
  developer surface - a Genomics API (direct programmatic access to 100M+ base pairs
  including SNPs, indels, and copy number variants with panel-grade coverage of
  actionable genes), an Ancestry API (continental ancestry for 6 global populations
  or regional ancestry for 26+ populations), and an Insight API (user-specific
  results for hundreds of traits and conditions, from single-marker traits to
  machine-learning polygenic risk scores) - alongside Embedded Apps and an App
  Acceleration Framework for building white-label DNA products. API access is
  enterprise/partner-gated and provisioned through Helix partnerships; there is no
  public self-serve developer portal or openly published API specification, so the
  API surface below is modeled from Helix's public product documentation.
